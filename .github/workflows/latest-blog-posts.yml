name: Update latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-blog-posts
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README with latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://guseoh.github.io/rss.xml"
          max_post_count: 3
          commit_message: "chore: update latest blog posts"
          committer_username: "blog-post-bot"
          committer_email: "blog-post-bot@example.com"
          enable_keepalive: false
          retry_count: 2
          retry_wait_time: 10
