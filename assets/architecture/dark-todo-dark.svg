<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Dark Todo Planner architecture</title><desc id="svg-desc">Browser, React Vite app, Hono Cloudflare Workers API, Cloudflare D1, todo calendar, project kanban, notes scratchpad, IndexedDB offline queue, scheduled Discord reminders, backup via GitHub Actions.</desc>
