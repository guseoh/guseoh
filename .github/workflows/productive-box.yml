name: Update productive gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-gist:
    if: ${{ vars.PINNED_GISTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Update productive gist
        uses: maxam2017/productive-box@master
        env:
          GH_TOKEN: ${{ secrets.PINNED_GIST_TOKEN }}
          GIST_ID: e1ad5cca2a41adb8cc37ba3233be410c
          TIMEZONE: Asia/Seoul
